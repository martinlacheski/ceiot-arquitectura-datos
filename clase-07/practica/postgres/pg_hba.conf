# pg_hba.conf del laboratorio (clase 7). El servicio postgres lo usa con
# `-c hba_file=/lab/pg_hba.conf` en lugar del que vive en el volumen de datos.
#
# Por qué un archivo montado: el pg_hba.conf del volumen se escribe una sola vez
# al inicializar, así que una regla nueva (la de replicación) no llegaría a un
# volumen ya creado. Montado desde el repositorio, vale igual en un volumen nuevo
# y en uno existente, y el reinicio del contenedor alcanza para aplicarlo.
#
# Las primeras siete reglas reproducen las que la imagen genera por defecto.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Nueva: la réplica (otro contenedor de la red de Compose) se conecta con el
# rol replicator y contraseña. La base "replication" no es una base de datos:
# es la palabra que habilita el protocolo de replicación (pg_basebackup y el
# streaming de WAL).
host    replication     replicator      all                     scram-sha-256

# El resto de las conexiones por red exigen contraseña.
host all all all scram-sha-256
